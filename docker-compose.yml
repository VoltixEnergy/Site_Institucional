services:
  voltix-db:
    build:
      context: .
      dockerfile: docker/Dockerfile.database.dev
    container_name: voltix-db
    ports:
      - "3307:3306"
    env_file:
      - .env.database
    volumes: 
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  voltix-app:
    build: 
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: voltix-app
    environment:
      DB_HOST: voltix-db  
    ports:
      - "3333:3333"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: always
    depends_on:
      - voltix-db

volumes:
  mysql_data: