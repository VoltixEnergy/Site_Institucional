<script>

    function abrir_navbar() {
        document.getElementById("navbar_celular").classList.toggle("ativo");
    }

    function buscarUsuarios() {
        var idEmpresa = 1
        console.log("Listando funcionarios da empresa!")
        fetch(`/usuarios/buscarUsuarioPorEmpresa/${idEmpresa}`, {
            method: "GET"
        })
            .then(function (resposta) {
                console.log(resposta)
                console.log("ESTOU NO THEN DO entrar()!")
                if (resposta.ok) {
                    console.log(resposta);
                    return resposta.json()
                } else {

                    console.log("Houve um erro ao tentar listar usuários!");

                    resposta.text().then(texto => {
                        console.error(texto);
                        finalizarAguardar(texto);
                    });
                }

            })
            .then(function (json) {

                console.log(json);

                json.forEach(item => {
                    document.getElementById("usersBox").innerHTML +=
                        `<div class="user">
                            <p id="userAvatar">${item.nome[0]+item.nome[1]}</p>
                            <p id="userName">${item.nome}</p>
                            <button class="mudarNome" id="mudarNome" onclick="abrirEditor(${item.id_usuario})">mudarNome</button>
                        </div>`
                });
            }).catch(function (erro) {
                console.log(erro);
            })
    }

    function editarNome(novoNome, idUsuario) {
        fetch("/usuarios/editarNome/:idUsuario", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                novoNome: novoNome,
                idUsuario: idUsuario
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);

                });

            } else {

                console.log("Houve um erro ao tentar atualizar os dados!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    let idUsuarioEditar = null
    // const mudarNomeDiv = document.getElementById("mudarNome")
    const editor = document.getElementById("editor")

    function abrirEditor(id){
        editor.style.display = "flex"
        idUsuarioEditar = id
    }

    function sairEditor(){
        editor.style.display = "none"
        idUsuarioEditar = null
    }

    function mudarNome(){
        novoNome = novoNome.value
        editarNome(novoNome, idUsuarioEditar)
    }

</script>
