<body>

    <div class="esquerda">

        <div class="info_esquerda">

            <div class="logo">
                <img src="./assets/icon/Logo.png" alt="logo_voltix">
                <span>Voltix</span>

            <div class="titulo">
                <h1>Energia sob controle, decisão com dados.</h1>

                <p>
                    Consumo em tempo real, alertas inteligentes e
                    indicadores de eficiência. Tudo em uma única
                    plataforma.
                </p>
            </div>

            <span class="copyright">
                © 2026 Voltix. Todos os direitos reservados.
            </span>

        </div>

    </div>

    <div class="login">

        <div class="info_login">

            <div class="celular">
                <img src="./assets/icon/Logo_escura.png" alt="">
                <span>Voltix</span>
            </div>

            <a href="index.html" class="voltar_home">← Voltar ao site</a>

            <h2>Insira o código que fornecemos para cadastrar a sua empresa!</h2>
            <span>Código:</span>
            <div class="inputs-whapper">
                <input type="text" maxlength="1" id="ipt1">
                <input type="text" maxlength="1" id="ipt2">
                <input type="text" maxlength="1" id="ipt3">
                <input type="text" maxlength="1" id="ipt4">
                <input type="text" maxlength="1" id="ipt5">
                <input type="text" maxlength="1" id="ipt6">
            </div>
            <button type="button" id="botao_gerar_codigo" onclick="exibirCodigoGerado()">Gerar código</button>
            <div id="codigo_gerado" aria-live="polite"></div>
            <button id="botao_entrar" onclick="validarCodigo()">Validar</button>
            <div id="cardErro">
                <span id="mensagem_erro"></span>
            </div>

        </div>

    </div>


</body>

</html>

<script>

    async function exibirCodigoGerado() {
        const codigo = gerarCodigo();
        const botao = document.getElementById("botao_gerar_codigo");
        const mensagem = document.getElementById("codigo_gerado");
        const cardErro = document.getElementById("cardErro");
        const mensagemErro = document.getElementById("mensagem_erro");

        botao.disabled = true;
        cardErro.style.display = "none";
        mensagem.textContent = "Cadastrando código...";

        try {
            const resposta = await fetch("/usuarios/adicionarCodigo", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    codigoServer: codigo
                })
            });

            if (!resposta.ok) {
                const erro = await resposta.text();
                throw new Error(erro || "Não foi possível cadastrar o código.");
            }

            codigo.split("").forEach((caractere, indice) => {
                document.getElementById(`ipt${indice + 1}`).value = caractere;
            });
            mensagem.textContent = `Código cadastrado: ${codigo}`;
        } catch (erro) {
            console.error("Erro ao cadastrar código:", erro);
            mensagem.textContent = "Não foi possível cadastrar o código.";
            mensagemErro.textContent = erro.message;
            cardErro.style.display = "block";
        } finally {
            botao.disabled = false;
        }
    }

    async function validarCodigo() {
        // aguardar();

        var codigoVar = ipt1.value + ipt2.value + ipt3.value + ipt4.value + ipt5.value + ipt6.value;
        console.log(codigoVar)


        if (codigoVar.length < 6) {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "Preencha todos os campos";
            // finalizarAguardar();
            return false;
        }
        else {
            // setInterval(sumirMensagem, 3000)
        }

        // botao_cadastrar.innerHTML = '<img src="./assets/imgs/aguarde-orange.gif" width="25">';

        await fetch("/usuarios/autenticarCodigo", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                codigoServer: codigoVar,
            })
        })
            .then(function (resposta) {

                console.log("ESTOU NO THEN DO entrar()!")
                if (resposta.ok) {
                    console.log(resposta);
                    setTimeout(function () {
                        window.location = "./cadastro_empresa.html";
                    }, 1000); // apenas para exibir o loading

                } else {

                    console.log("Houve um erro ao autenticar o código!");
                    cardErro.style.display = "block"
                    mensagem_erro.innerHTML = "Código inválido";
                    setTimeout(function () {
                        sumirMensagem();
                    }, 4000);
                    resposta.text().then(texto => {
                        console.error(texto);
                        finalizarAguardar(texto);
                    });
                }

            }).catch(function (erro) {
                console.log(erro);
            })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }
    // source: https://www.youtube.com/shorts/zolDnL_FAjQ
    let input = [...document.querySelectorAll('input')]
    input.forEach(element => {
        element.addEventListener('keyup', () => {
            if (input.indexOf(element) + 1 != input.length) {
                input[input.indexOf(element) + 1].focus()
            }
        })
    })

</script>
