<body onload="carregarInformacoesUsuario(); redirectByRole()">

    <aside class="navbar">

        <nav class="navbar-items">

            </a>

            <a href="./users" class="item" id="navUser">

        <div class="user-data">
            <div class="icon avatarUsuario" id="avatarUsuario"></div>
            <div class="info">
                <span class="name nomeUsuario" id="nomeUsuario"></span>
                <span class="email emailUsuario" id="emailUsuario"></span>
            </div>

            <i class="ph ph-sign-out exit-button" onclick="limparSessao()"></i>
        </div>
    </aside>
    <div class="dash-content">

        <div class="kpis-title">
            <div class="header-top">
                <span class="main-title">Dashboard de Alertas</span>
                <button class="btn-pdf" onclick="">
                    <i class="ph ph-file-pdf"></i>
                    <span>Gerar PDF</span>
                </button>
            </div>
            <hr class="title-divider" />
        </div>


        <div class="kpi-content">
            <div class="kpi-integrado">
                <button class="btn-info" onclick="">
                    <i class="ph ph-info"></i>
                </button>
                <div class="kpi">
                    <span class="kpi-title">Total de Alertas</span>
                    <span class="kpi-value" id="alertasAcionaveis"></span>
                    <span class="kpi-meta" id="meta"></span>
                </div>
                <div class="kpi-grafico">
                    <span class="kpi-grafico-title">Distribuição dos Alertas nos componentes</span>
                    <div class="grfico-kpi">
                        <canvas id="graficoPizza"></canvas>
                    </div>
                </div>
            </div>

            <div class="grafic">
                <button class="btn-info" onclick="">
                    <i class="ph ph-info"></i>
                </button>
                <span class="grafic-title">Comparação da quantidade de alertas com o último mês</span>
                <div class="canvas-wrapper">
                    <canvas id="stackedLineChart"></canvas>
                </div>
            </div>
        </div>


        <div class="graficos">
            <div class="grafic-integrado">
                <div class="grafic-item">
                    <button class="btn-info" onclick="">
                        <i class="ph ph-info"></i>
                    </button>
                    <span class="grafic-title">Distribuição dos alertas nos meses</span>
                    <div class="canvas-wrapper">
                        <canvas id="stackedBarChart"></canvas>
                    </div>
                </div>

                <div class="grafic-item">
                    <button class="btn-info" onclick="">
                        <i class="ph ph-info"></i>
                    </button>
                    <span class="grafic-title" id="tituloRosca"> Distribuição dos alertas por categoria (clique em uma
                        barra) </span>
                    <div class="canvas-wrapper">
                        <canvas id="graficoRosca"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const COMPONENTES = ['CPU', 'RAM', 'Disco', 'Download', 'Upload'];
        const CORES_COMPONENTES = ['#0e87a5', '#1e5aa8', '#ed7d31', '#ff9233', '#eb1e4b'];
        const MESES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

        // Tipos de alerta, na mesma ordem das 3 séries do gráfico de barras
        const TIPOS_ALERTA = ['abaixoMinimo', 'proximoMaximo', 'acimaMaximo'];
        const CORES_BARRAS = ['#0e87a5', '#ff9233', '#eb1e4b'];


        let selecionado = null;

        // ---------- Cores e bordas das barras ---------- --> feito por ia, estudar

        function estaSelecionado(ctx) {
            return selecionado
                && selecionado.posicao === ctx.dataIndex
                && selecionado.tipo === TIPOS_ALERTA[ctx.datasetIndex];
        }

        function corDaBarra(ctx) {
            const cor = CORES_BARRAS[ctx.datasetIndex];
            if (!selecionado) return cor;
            return estaSelecionado(ctx) ? cor : cor + '66';
        }

        function bordaDaBarra(ctx) {
            return estaSelecionado(ctx) ? '#0f172a' : '#f8fafc';
        }

        function larguraDaBorda(ctx) {
            return Number(ctx.raw) > 0 ? 3 : 0;
        }

        // ---------- Gráficos ----------

        const opcoesNumeros = {
            color: '#fff', textStrokeColor: '#000', textStrokeWidth: 2,
            font: { weight: 'bold', size: 20 },
            display: (ctx) => ctx.dataset.data[ctx.dataIndex] > 0
        };

        const graficoPizza = new Chart(document.getElementById('graficoPizza'), {
            type: 'pie',
            plugins: [ChartDataLabels],
            data: {
                labels: COMPONENTES,
                datasets: [{
                    data: [0, 0, 0, 0, 0],
                    backgroundColor: CORES_COMPONENTES
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'right' },
                    datalabels: opcoesNumeros
                }
            }
        });

        const graficoRosca = new Chart(document.getElementById('graficoRosca'), {
            type: 'doughnut',
            plugins: [ChartDataLabels],
            data: {
                labels: COMPONENTES,
                datasets: [{
                    data: [0, 0, 0, 0, 0],
                    backgroundColor: CORES_COMPONENTES
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'right' },
                    datalabels: opcoesNumeros
                }
            }
        });
        const graficoBarras = new Chart(document.getElementById('stackedBarChart'), {
            type: 'bar',
            data: {
                labels: [],
                datasets: [
                    { label: 'Abaixo do limite mínimo', data: [] },
                    { label: 'Próximo ao limite máximo', data: [] },
                    { label: 'Acima do limite máximo', data: [] }
                ].map(serie => ({
                    ...serie,
                    backgroundColor: corDaBarra,
                    borderColor: bordaDaBarra,
                    borderWidth: larguraDaBorda,
                    borderSkipped: false,
                    hoverBorderColor: '#0f172a'
                }))
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                onHover: (evento, elementos) => { // animecao do cursor
                    evento.native.target.style.cursor = elementos.length ? 'pointer' : 'default';
                },
                onClick: (evento, elementos) => {
                    if (!elementos.length) return;
                    const { datasetIndex, index } = elementos[0];
                    const tipo = TIPOS_ALERTA[datasetIndex];

                    if (selecionado && selecionado.posicao === index && selecionado.tipo === tipo) {
                        selecionado = null;
                        document.getElementById('tituloRosca').textContent =
                            'Distribuição dos alertas por categoria (clique em uma barra)';

                        graficoRosca.data.datasets[0].data = [0, 0, 0, 0, 0];
                        graficoRosca.update('none');
                        graficoBarras.update('none');
                        buscarDados();
                        return;
                    }

                    const mes = graficoBarras.data.labels[index];
                    const nomeTipo = graficoBarras.data.datasets[datasetIndex].label;

                    selecionado = { posicao: index, tipo, texto: `${mes} - ${nomeTipo}` };
                    graficoBarras.update('none');
                    document.getElementById('tituloRosca').textContent =
                        `Distribuição dos alertas por categoria (${selecionado.texto})`;
                    buscarDados();
                },
                plugins: { legend: { position: 'bottom' } },
                scales: {
                    x: { stacked: true },
                    y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } }
                }
            }
        });

        const graficoLinhas = new Chart(document.getElementById('stackedLineChart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Mês atual',
                        data: [],
                        borderColor: '#ed7d31',
                        backgroundColor: '#ed7d31'
                    },
                    {
                        label: 'Mês anterior',
                        data: [],
                        borderColor: '#1e5aa8',
                        backgroundColor: '#1e5aa8'
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } },
                scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
            }
        });

        // ---------- Atualização com os dados da API ----------

        let metaPreenchida = false;
        function informarMeta(dados) {
            if (metaPreenchida) return;

            const total = dados.comparacaoMeses.mesAnterior
                .reduce((soma, valor) => soma + Number(valor), 0);

            document.getElementById('meta').textContent = `Meta: menos de ${total} alertas`;
            if (dados.totalAlertas > total) document.getElementById('meta').classList.add('meta estrapolada');
            metaPreenchida = true;
        }

        function organizarPorNome(lista, campo) {
            return COMPONENTES.map(nome => {
                const item = lista.find(l => l[campo] === nome);
                return item ? Number(item.total) : 0;
            });
        }

        function atualizarGraficos(dados) {
            document.getElementById('alertasAcionaveis').textContent = dados.totalAlertas;

            graficoPizza.data.datasets[0].data = organizarPorNome(dados.porComponente, 'componente');
            graficoRosca.data.datasets[0].data = organizarPorNome(dados.porCategoria, 'categoria');

            const meses = dados.distribuicaoMeses;
            graficoBarras.data.labels = meses.meses;
            graficoBarras.data.datasets[0].data = meses.abaixoMinimo;
            graficoBarras.data.datasets[1].data = meses.proximoMaximo;
            graficoBarras.data.datasets[2].data = meses.acimaMaximo;

            const mesAtual = dados.comparacaoMeses.mesAtual.map(Number);
            let ultimoDia = -1;
            mesAtual.forEach((valor, i) => { if (valor > 0) ultimoDia = i; });

            const numeroMes = new Date().getMonth();
            graficoLinhas.data.labels = mesAtual.map((_, i) => String(i + 1));
            graficoLinhas.data.datasets[0].label = MESES[numeroMes];
            graficoLinhas.data.datasets[0].data = mesAtual.map((valor, i) => (i <= ultimoDia ? valor : null));
            graficoLinhas.data.datasets[1].label = MESES[(numeroMes + 11) % 12];
            graficoLinhas.data.datasets[1].data = dados.comparacaoMeses.mesAnterior.map(Number);

            [graficoPizza, graficoRosca, graficoBarras, graficoLinhas].forEach(g => g.update('none'));
            informarMeta(dados);
        }

        async function buscarDados() {
            try {
                let caminho = '/manager/dashboard';
                if (selecionado) caminho += `?posicao=${selecionado.posicao}&tipo=${selecionado.tipo}`;

                const resposta = await fetch(caminho, { credentials: 'include', cache: 'no-store' });
                if (resposta.status === 403) return limparSessao();
                atualizarGraficos(await resposta.json());
            } catch (erro) {
                console.error(erro);
            }
        }
        buscarDados();
        setInterval(buscarDados, 5000);
    </script>
