<!DOCTYPE html>
<html lang="pt-br">

<head>

    <link rel="shortcut icon" href="../../assets/icon/Logo.ico" type="image/x-icon">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voltix | Alertas</title>

    <link rel="stylesheet" href="../../css/dashboard-layout.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="../../css/toast.css"></link>

    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">

    <script src="../../js/sessao.js"></script>
    <script src="../../js/alerta.js"></script>
    <script src="../../js/toast.js"></script>
    <script src="./script.js"></script>

</head>
<body onload="carregarInformacoesUsuario(); loadCompanyName(); listaDeAlertas();">
  <header class="mobile-header">
    <div class="user-data">
      <div class="icon avatarUsuario" id="avatarUsuario"></div>

      <div class="info">
        <span class="name nomeUsuario" id="nomeUsuario"></span>
        <span class="email emailUsuario" id="emailUsuario"></span>
      </div>

      <i class="ph ph-sign-out exit-button" onclick="limparSessao()"></i>
    </div>
  </header>
  <nav class="mobile-navbar">
    <a href="../" class="item">
      <i class="ph ph-chart-line"></i>
    </a>

    <a href="../users" class="item active">
      <i class="ph ph-users-three"></i>
    </a>

    <a href="../servers" class="item">
      <i class="ph ph-hard-drives"></i>
    </a>

    <a href="../codes" class="item">
      <i class="ph ph-numpad"></i>
    </a>
  </nav>

    <aside class="navbar">
        <div class="logo">
            <img src="../../assets/icon/Logo.png">
            <span>Voltix</span>
        </div>


        <nav class="navbar-items">
            <a href="../" class="item">
                <i class="ph ph-chart-line"></i>
                Dashboard
            </a>
            <a href="../users/" class="item">
                <i class="ph ph-users-three"></i>
                Funcionários
            </a>
            <a href="../servers" class="item">
                <i class="ph ph-hard-drives"></i>
                Servidores
            </a>
            <a href="../codes" class="item">
              <i class="ph ph-numpad"></i>
              Códigos
            </a>
            <a href="./" class="item active">
              <i class="ph ph-warning"></i>
              Alertas
            </a>
        </nav>


        <div class="user-data">
            <div class="icon avatarUsuario" id="avatarUsuario"></div>
            <div class="info">
                <span class="name nomeUsuario" id="nomeUsuario"></span>
                <span class="email emailUsuario" id="emailUsuario"></span>
            </div>

            <i
                class="ph ph-sign-out exit-button"
                onclick="limparSessao()">
            </i>
        </div>
    </aside>

    <main class="content">
            <div class="page-title">
                <div>
                    <h1>Alertas</h1>
                    <h2 id="companyName">
                        @ Empresa
                    </h2>
                </div>

                <a class="button-dashboard" href="../">
                    <i class="ph ph-house"></i>
                </a>
            </div>

            <hr>

            <div class="filter">
                <select name="filtro" id="filter">
                  <option value="ipt_filter">FILTRAR</option>
                </select>
              </div>


            <div id="listarAlertas">
                <div class="user-list-header">
                    <span>ID</span>  
                    <span>Servidor</span>
                    <span>Alerta</span>
                    <span>Data-hora</span>
                </div>
            </div>
        </div>
            
    </main>
  <div id="toast-container" class="toast-container"></div>
</body>
</html>
