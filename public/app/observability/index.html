<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voltix | Observabilidade</title>

  <!-- Importações Externas -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
    <link
    rel="stylesheet"
    type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
  />
  <link
    rel="stylesheet"
    type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"
  />

  <!-- Importações Internas -->
  <link rel="stylesheet" href="../../css/dashboard-layout.css">
  <script src="script.js"></script>
  <script src="../../js/sessao.js"></script>
</head>

<body onload="carregarInformacoesUsuario()">
  <header class="mobile-header">
    <div class="user-data">
      <div class="icon avatarUsuario" id="avatarUsuario"></div>

      <div class="info">
        <span class="name nomeUsuario" id="nomeUsuario"></span>
        <span class="email emailUsuario" id="emailUsuario"></span>
      </div>

      <i class="ph ph-sign-out exit-button" onclick="limparSessao()"></i>
    </div>
  </header>

  <nav class="mobile-navbar">
    <a href="./" class="item active">
      <i class="ph ph-chart-line"></i>
    </a>
  </nav>

  <aside class="navbar">
    <div class="logo">
      <img src="../../assets/icon/Logo.png"><span>Voltix</span>
    </div>

    <nav class="navbar-items">
      <a href="./" class="item active" id="navDashboard">
        <i class="ph ph-chart-line"></i>
        Dashboard
      </a>
    </nav>

    <div class="user-data">
      <div class="icon avatarUsuario" id="avatarUsuario"></div>

      <div class="info">
        <span class="name nomeUsuario" id="nomeUsuario"></span>
        <span class="email emailUsuario" id="emailUsuario"></span>
      </div>

      <i class="ph ph-sign-out exit-button" onclick="limparSessao()"></i>
    </div>
  </aside>
  <main class="content">
    <div></div>
  </main>
</body>
</html>
