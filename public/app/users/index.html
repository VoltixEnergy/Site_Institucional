<!DOCTYPE html>
<html lang="pt-br">

<head>
  <link rel="shortcut icon" href="../../assets/icon/Logo.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voltix | Relatórios</title>


  <link rel="stylesheet" href="../../css/dash.css">
  <link rel="stylesheet" href="../../css/estilo.css" />
  <script src="../../js/sessao.js"></script>
  <script src="../../js/alerta.js"></script>
  <script src="./script.js"></script>

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">

  <!-- scripts do Chart.js - 2022-1 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!--FONT AWESOME-->
  <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>
</head>

<body onload="buscarUsuarios(); carregarInformacoesUsuario()">

  <div class="navbar">

    <div class="info_navbar">

      <div class="logo">
        <img src="../../assets/icon/Logo.png"><span>Voltix</span>
      </div>

      <div class="botoes_navbar">

        <a href="../" class="fora"><img src="../../assets/imgs/icone_dashboard.png"> Dashboard</a>


        <a href="./" class="agora"><img src="../../assets/imgs/icone_funcionario.png">
          Funcionários</a>


        <a href="../servers" class="fora"><img src="../../assets/imgs/icone_servidor.png"> Servidores</a>

      </div>

      <div class="usuario_navbar">

        <div class="avatar_usuario" id="avatarUsuario"></div>

        <div class="info_usuario">

          <span class="nome_usuario" id="nomeUsuario"></span>
          <br>
          <span class="email_usuario" id="emailUsuario"></span>

        </div>

        <img src="../../assets/imgs/icone_sair.png" class="sair_dash" onclick="window.location.href='../../index.html'">
      </div>

    </div>

  </div>

  <div class="content">
    <div class="searchBar">
      <p>Funcionários</p>
      <button onclick="abrirAddUser()">+</button>
    </div>

    <div class="users" id="usersBox">
      <!-- <div class="user">
                <p id="userAvatar">asd</p>
                <p id="userName">asd</p>
            </div> -->
    </div>

    <div class="geral" id="geral_editor">

      <div id="editor">
        <div class="topButtons">
          <button class="sair" id="sairEditor" onclick="sairEditor()"><img src="../../assets/imgs/icone_sair.png"
              alt=""></button>
        </div>
        <div class="midInputs">
          <span>Digite o novo nome:</span><input type="text" id="novoNome">
        </div>
        <div class="functionsButtons">
          <button id="mudarNome" onclick="mudarNome()">Alterar Nome</button>
          <button id="deletarUsuario" onclick="deletarUsuario()">Apagar Usuário</button>
        </div>
      </div>
    </div>

    <div class="geral" id="geral_addUser">

      <div id="addUser">

        <div class="topButtons">
          <button class="sair" onclick="sairAddUser()"><img src="../../assets/imgs/icone_sair.png" alt=""></button>
        </div>

        <span>Crie uma nova conta para um usuário</span>

        <div class="group">
          <span>Nome</span><input type="text" id="iptNome">
          <span>Email</span> <input type="text" id="iptEmail">
          <span>CPF</span> <input type="text" id="iptCpf">
        </div>
        <div class="group">
          <span>Senha</span> <input type="text" id="iptSenha">
          <span>Confirme a Senha</span> <input id="iptReSenha">
        </div>
        <button onclick="cadastrar()">Cadastrar</button>
      </div>

    </div>

    <div class="perfil_celular">

      <div class="logo_celular" onclick="abrir_navbar()">
        <img src="../../assets/icon/Logo.png" alt="">
      </div>

      <div class="usuario_celular">
        <div class="avatar_usuario" id="avatarUsuario_celular"></div>
      </div>

    </div>

    <div id="navbar_celular" class="navbar_celular">

      <a href="../">
        <img src="../../assets/imgs/icone_dashboard.png">
      </a>

      <a href="../users">
        <img src="../../assets/imgs/icone_funcionario.png">
      </a>

      <a href="../servers">
        <img src="../../assets/imgs/icone_servidor.png">
      </a>

      <a href="../../index.html">
        <img src="../../assets/imgs/icone_sair.png">
      </a>


      <button class="fechar_navbar" onclick="abrir_navbar()">

      </button>

    </div>

</body>

</html>
